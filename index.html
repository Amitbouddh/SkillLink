<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skill Link — The workforce network for makers</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

<style>
:root{
  --ink:#0f1222;
  --ink-soft:#3f4258;
  --muted:#6b7280;
  --faint:#9aa0b4;
  --line:#e6e8f0;
  --surface:#ffffff;
  --bg:#f6f7fb;
  --navy:#11132c;
  --navy-soft:#1a1d3d;
  --indigo:#4338ca;
  --indigo-600:#4f46e5;
  --indigo-50:#eef0ff;
  --lavender:#b6c0fb;
  --green:#16803c;
  --green-bg:#e5f6ea;
  --amber:#b45309;
  --amber-bg:#fef3e2;
  --red:#b91c1c;
  --red-bg:#fdeceb;
  --purple:#7c3aed;
  --purple-bg:#f2ecfd;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.serif{font-family:'Instrument Serif', serif; font-style:italic; font-weight:400;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#cfd3e2;border-radius:10px;}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;border-radius:10px;padding:10px 20px;cursor:pointer;border:1px solid transparent;transition:all .15s ease;white-space:nowrap;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--indigo-600);color:#fff;box-shadow:0 1px 2px rgba(20,20,50,.08);}
.btn-primary:hover:not(:disabled){background:var(--indigo);}
.btn-secondary{background:#fff;color:var(--ink);border-color:var(--line);}
.btn-secondary:hover:not(:disabled){border-color:#c7cbe0;background:#fafbff;}
.btn-ghost{background:transparent;color:var(--muted);}
.btn-ghost:hover:not(:disabled){background:#eef0f7;color:var(--ink);}
.btn-dark{background:var(--navy);color:#fff;}
.btn-dark:hover:not(:disabled){background:#000;}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:9px;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;transition:box-shadow .15s ease, transform .15s ease;}
.card-hover:hover{box-shadow:0 8px 24px rgba(20,20,60,.06);transform:translateY(-1px);}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 11px;border-radius:20px;}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}
.badge-red{background:var(--red-bg);color:var(--red);}
.badge-indigo{background:var(--indigo-50);color:var(--indigo);}
.badge-gray{background:#eef0f4;color:var(--muted);}
.badge-purple{background:var(--purple-bg);color:var(--purple);}
.badge-navy{background:rgba(255,255,255,.1);color:#dfe3ff;border:1px solid rgba(255,255,255,.14);}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--indigo);}

.input-field{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;outline:none;transition:all .15s ease;}
.input-field:focus{border-color:var(--indigo-600);box-shadow:0 0 0 3px rgba(79,70,229,.12);}
.input-field::placeholder{color:var(--faint);}

.sidebar-item{display:flex;align-items:center;gap:12px;padding:9px 13px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .12s ease;}
.sidebar-item i{width:18px;text-align:center;font-size:15px;color:var(--faint);}
.sidebar-item:hover{background:#f2f3f9;color:var(--ink);}
.sidebar-item.active{background:var(--indigo-50);color:var(--indigo);font-weight:600;}
.sidebar-item.active i{color:var(--indigo);}

.avatar-img{border-radius:50%;object-fit:cover;flex-shrink:0;background:#e9ebf3;}

.modal-overlay{position:fixed;inset:0;background:rgba(10,10,25,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .15s ease;padding:16px;}
.modal-content{background:#fff;border-radius:18px;padding:28px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp .2s ease;box-shadow:0 20px 60px rgba(10,10,30,.2);}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.toast-container{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--navy);color:#fff;padding:13px 18px;border-radius:12px;font-size:14px;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;animation:slideUp .2s ease;}

.hero-navy{background:radial-gradient(ellipse 120% 100% at 20% 0%, #1c2050 0%, var(--navy) 55%);border-radius:18px;color:#fff;}
.msg-bubble{padding:10px 15px;border-radius:15px;max-width:75%;font-size:14px;line-height:1.55;}
.msg-bubble.sent{background:var(--indigo-600);color:#fff;border-bottom-right-radius:4px;}
.msg-bubble.received{background:#eef0f4;color:var(--ink);border-bottom-left-radius:4px;}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

.role-pick{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .12s ease;}
.role-pick:hover{border-color:#c7cbe0;background:#fafbff;}
.role-pick.selected{border-color:var(--indigo-600);background:var(--indigo-50);}

@media (max-width: 900px){
  .app-sidebar{display:none !important;}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel">
const { useState, createContext, useContext } = React;

/* ---------- helpers ---------- */

function PersonImg({ src, fallback, alt, className, style }) {
  return <img src={src} alt={alt} className={className} style={style}
    onError={(e)=>{ e.target.onerror=null; e.target.src=fallback; }} />;
}

/* ---------- mock data ---------- */

const WORKSPACES = [

    rating:4.7, projects:94, match:88, available:true,
    image:'https://images.unsplash.com/photo-1560250097-0b93528c311a?w=300&h=300&fit=crop&q=80',

    rating:4.9, projects:112, match:85, available:false,

    fallback: initials('Sunita Verma','7c3aed') },

const CURRENT_ARTISAN = { ...ARTISANS[0], company:'Independent Artisan' };

const REQUIREMENTS = [
  { id:1, title:'Hand-carved dining collection', type:'Wood carving', location:'Jodhpur', status:'AI matching', progress:70, daysLeft:12, newApps:null },
  { id:2, title:'Brass hardware — Q4 run', type:'Metal craft', location:'Jaipur', status:'AI matching', progress:35, daysLeft:28, newApps:3 },
  { id:3, title:'Block print capsule', type:'Textile work', location:'Ahmedabad', status:'Draft', progress:0, daysLeft:null, newApps:null },
];

const JOBS = [
  { id:1, title:'Brass hardware — Q4 run', location:'Jaipur', match:91, price:'₹80,000', tag:'Bh—Qr', color:'7c3aed' },
  { id:2, title:'Dining collection', location:'Jodhpur', match:88, price:'₹50,000', tag:'Dc', color:'4f46e5' },
  { id:3, title:'Boutique hotel fit-out', location:'Mumbai', match:82, price:'₹1.4L', tag:'Bhf', color:'16803c' },

const PROJECT = {

  artisan:'Rajesh Kumar', budget:'₹50,000', deadline:'30 Oct 2024', started:'01 Sep 2024',

    { id:4, title:'Delivery', note:'Packaging and dispatch', state:'pending' },
  ],
};

const APPLICATIONS_M = [
  { id:1, name:'Meera Joshi', image: ARTISANS[1].image, fallback: ARTISANS[1].fallback, req:'Hand-carved dining collection', status:'applied', when:'2 days ago' },
  { id:2, name:'Imran Sheikh', image: ARTISANS[2].image, fallback: ARTISANS[2].fallback, req:'Brass hardware — Q4 run', status:'shortlisted', when:'1 day ago' },
  { id:3, name:'Sunita Verma', image: ARTISANS[3].image, fallback: ARTISANS[3].fallback, req:'Brass hardware — Q4 run', status:'applied', when:'5 hours ago' },
];

const APPLICATIONS_A = [
  { id:1, title:'Dining collection', company:'Aria Manufacturing', status:'shortlisted', when:'2 days ago' },
  { id:2, title:'Boutique hotel fit-out', company:'Marriott Projects', status:'applied', when:'6 hours ago' },
];

const MESSAGES_SEED = [
  { id:1, from:'Rajesh Kumar', fromImage: ARTISANS[0].image, fromFallback: ARTISANS[0].fallback, text:'Hi, I\u2019d love to take on the dining collection order.', time:'2h ago', mine:false },
  { id:2, from:'me', text:'Great — can you share your available start date?', time:'1h ago', mine:true },
  { id:3, from:'Rajesh Kumar', fromImage: ARTISANS[0].image, fromFallback: ARTISANS[0].fallback, text:'I can start Monday. 24 units by end of October works well.', time:'40m ago', mine:false },
];

const NOTIFICATIONS = [
  { id:1, text:'Meera Joshi applied to \u201cHand-carved dining collection\u201d', time:'10m ago', read:false, icon:'fa-user-plus' },
  { id:2, text:'Aria Manufacturing shortlisted you for \u201cBrass hardware \u2014 Q4 run\u201d', time:'30m ago', read:false, icon:'fa-star' },
  { id:3, text:'Rajesh Kumar sent you a message', time:'1h ago', read:false, icon:'fa-comment' },
  { id:4, text:'Project \u201cHand-carved dining collection\u201d hit 40% progress', time:'Yesterday', read:true, icon:'fa-chart-line' },
];

const POSTS_SEED = [
  { id:1, authorId:'a1', name:'Rajesh Kumar', role:'Wood Carving · Jodhpur', image: ARTISANS[0].image, fallback: ARTISANS[0].fallback,
    time:'5h ago', text:'Just finished a hand-carved sheesham dining table \u2014 24 pieces, all joinery done by hand. Open to custom orders for the festive season.',
    photo:'https://images.unsplash.com/photo-1533090161767-e6ffed986c88?w=700&h=380&fit=crop&q=80',
    likes:42, comments:[{ user:'Meera Joshi', text:'Beautiful grain work!' }], shares:7, tag:'Service available' },
  { id:2, authorId:'a4', name:'Sunita Verma', role:'Block Printing · Ahmedabad', image: ARTISANS[3].image, fallback: ARTISANS[3].fallback,
    time:'1d ago', text:'New run of naturally-dyed block print cushion covers and sarees is ready. Booking custom prints for December.',
    photo:'https://images.unsplash.com/photo-1596496181848-3091d4878b24?w=700&h=380&fit=crop&q=80',
    likes:56, comments:[{ user:'Imran Sheikh', text:'Need a few cushions \u2014 sending you a DM.' }], shares:12, tag:'Service available' },
  { id:3, authorId:'m1', name:'Aditi Shah', role:'Aria Manufacturing · Jodhpur', image: MANUFACTURER.image, fallback: MANUFACTURER.fallback,
    time:'2d ago', text:'We just closed our Q4 brass hardware sourcing brief with three excellent shortlisted artisans. Thanks to everyone who applied \u2014 more briefs going live this week.',
    photo:null, likes:29, comments:[], shares:3, tag:null },
  { id:4, authorId:'a3', name:'Imran Sheikh', role:'Metal Craft · Udaipur', image: ARTISANS[2].image, fallback: ARTISANS[2].fallback,
    time:'4d ago', text:'Hand-forged brass door handles and copper wall art, made to order. Also taking on wrought iron commissions.',
    photo:'https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=700&h=380&fit=crop&q=80',
    likes:28, comments:[], shares:4, tag:'Service available' },
];

const REVIEWS = [
  { id:1, name:'Aria Manufacturing', rating:5, text:'Exceptional finish and delivered ahead of schedule.', project:'Dining collection', when:'2 weeks ago' },
  { id:2, name:'Priya Furniture House', rating:5, text:'Reliable, communicative, and precise work.', project:'Furniture restoration', when:'1 month ago' },
];

/* ---------- context ---------- */

const AppContext = createContext();
function useApp(){ return useContext(AppContext); }

function AppProvider({ children }) {
  const [page, setPage] = useState('landing');
  const [selectedRole, setSelectedRole] = useState('manufacturer');
  const [currentUser, setCurrentUser] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [applications, setApplications] = useState({ manufacturer: APPLICATIONS_M, artisan: APPLICATIONS_A });
  const [notifications, setNotifications] = useState(NOTIFICATIONS);
  const [messages, setMessages] = useState(MESSAGES_SEED);
  const [requirements, setRequirements] = useState(REQUIREMENTS);
  const [posts, setPosts] = useState(POSTS_SEED);
  const [showCreatePost, setShowCreatePost] = useState(false);

  const likePost = (id) => setPosts(prev => prev.map(p => p.id===id ? {...p, likes:p.likes+1, liked:true} : p));
  const commentOnPost = (id, text) => setPosts(prev => prev.map(p => p.id===id ? {...p, comments:[...p.comments, {user: currentUser?.name || 'You', text}]} : p));
  const createPost = (text) => {
    if (!currentUser || !text.trim()) return;
    setPosts(prev => [{ id:Date.now(), authorId:currentUser.id, name:currentUser.name,
      role: currentUser.role==='manufacturer' ? currentUser.company : `${(currentUser.craft)||'Artisan'} · ${currentUser.location||''}`,
      image:currentUser.image, fallback:currentUser.fallback, time:'now', text, photo:null, likes:0, comments:[], shares:0, tag:null }, ...prev]);
    setShowCreatePost(false);
    addToast('Post published.');
  };

  const addToast = (msg) => {
    const id = Date.now();
    setToasts(prev => [...prev, { id, msg }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
  };

  const enterWorkspace = () => {
    if (selectedRole === 'admin') { addToast('Platform admin demo coming soon \u2014 try Manufacturer or Artisan.'); return; }
    const user = selectedRole === 'manufacturer' ? MANUFACTURER : CURRENT_ARTISAN;
    setCurrentUser(user);
    setPage('dashboard');
    addToast(`Welcome back, ${user.name.split(' ')[0]}.`);
  };

  const logout = () => { setCurrentUser(null); setPage('landing'); };

  const markAllRead = () => { setNotifications(prev => prev.map(n => ({...n, read:true}))); addToast('All notifications marked as read.'); };

  const updateAppStatus = (id, status) => {
    setApplications(prev => ({ ...prev, manufacturer: prev.manufacturer.map(a => a.id===id ? {...a, status} : a) }));
    addToast(status === 'shortlisted' ? 'Applicant shortlisted.' : 'Applicant declined.');
  };

  const sendMessage = (text) => {
    setMessages(prev => [...prev, { id:Date.now(), from:'me', text, time:'now', mine:true }]);
  };

  const value = { page, setPage, selectedRole, setSelectedRole, currentUser, enterWorkspace, logout,
    toasts, addToast, applications, notifications, setNotifications, markAllRead, updateAppStatus,
    messages, sendMessage, requirements, posts, likePost, commentOnPost, createPost, showCreatePost, setShowCreatePost };
  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

/* ---------- shared bits ---------- */

function Logo({ dark }) {
  return <div className="flex items-center gap-2">
    <div className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--indigo-600)'}}>
      <i className="fas fa-bolt text-white text-sm"></i>
    </div>
    <span className="text-lg font-extrabold tracking-tight" style={{color: dark ? '#fff' : 'var(--ink)'}}>Skill <span style={{color:'var(--indigo-600)'}}>Link</span></span>
  </div>;
}

function ToastContainer() {
  const { toasts } = useApp();
  return <div className="toast-container">
    {toasts.map(t => <div key={t.id} className="toast">
      <i className="fas fa-check-circle" style={{color:'#86efac'}}></i>
      <span>{t.msg}</span>
    </div>)}
  </div>;
}

function Modal({ isOpen, onClose, title, children }) {
  if (!isOpen) return null;
  return <div className="modal-overlay" onClick={onClose}>
    <div className="modal-content" onClick={e=>e.stopPropagation()}>
      {title && <h3 className="text-lg font-bold mb-4">{title}</h3>}
      {children}
    </div>
  </div>;
}

/* ---------- LANDING ---------- */

function LandingPage() {

  return <div className="min-h-screen bg-white">

    <section className="max-w-7xl mx-auto px-6 py-16 md:py-24">

        <div>
          <span className="badge badge-green mb-6"><i className="fas fa-sparkles text-[10px]"></i> The workforce network for makers</span>
          <h1 className="text-5xl md:text-6xl font-extrabold leading-[1.05] tracking-tight" style={{color:'var(--ink)'}}>
            Connect skills.<br/>
            <span className="serif" style={{color:'var(--indigo-600)', fontSize:'1.05em'}}>Build opportunities.</span>
          </h1>
          <p className="text-lg mt-6 max-w-md leading-relaxed" style={{color:'var(--muted)'}}>

          <div className="flex flex-wrap items-center gap-4 mt-8">
            <button className="btn btn-primary" onClick={()=>setPage('login')}>Get started <i className="fas fa-arrow-right text-xs"></i></button>
            <button className="btn btn-ghost" onClick={()=>setPage('login')}>Explore talent <i className="fas fa-play text-[10px]"></i></button>
          </div>
          <div className="flex items-center gap-3 mt-10">
            <div className="flex -space-x-2">
              {['R','M','I'].map((l,i)=><div key={i} className="w-9 h-9 rounded-full border-2 border-white flex items-center justify-center text-xs font-bold text-white" style={{background:['#4f46e5','#16803c','#b45309'][i]}}>{l}</div>)}

            <PersonImg

          </div>
          <div className="absolute -top-5 -left-5 bg-white rounded-xl shadow-xl border p-3.5 flex items-center gap-3" style={{borderColor:'var(--line)'}}>
            <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{background:'var(--indigo-50)'}}><i className="fas fa-bolt" style={{color:'var(--indigo-600)'}}></i></div>
            <div>
              <div className="text-sm font-bold">AI Match found</div>
              <div className="text-xs" style={{color:'var(--muted)'}}>Rajesh Kumar · 94%</div>
            </div>
            <i className="fas fa-check-circle text-sm" style={{color:'var(--green)'}}></i>
          </div>
          <div className="absolute -bottom-5 -right-5 bg-white rounded-xl shadow-xl border p-3.5 flex items-center gap-3" style={{borderColor:'var(--line)'}}>
            <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{background:'var(--green-bg)'}}><i className="fas fa-shield-halved" style={{color:'var(--green)'}}></i></div>

function FeedPage() {
  const { currentUser, posts, likePost, commentOnPost, createPost, showCreatePost, setShowCreatePost } = useApp();
  const [commentText, setCommentText] = useState({});
  const [openComments, setOpenComments] = useState({});
  const [draft, setDraft] = useState('');

  const handleComment = (id) => {
    const text = (commentText[id] || '').trim();
    if (!text) return;
    commentOnPost(id, text);
    setCommentText({ ...commentText, [id]: '' });
  };

  return <div className="max-w-2xl">
    <div className="card mb-5 flex items-center gap-3">
      <PersonImg src={currentUser.image} fallback={currentUser.fallback} alt={currentUser.name} className="avatar-img" style={{width:40,height:40}} />
      <button className="input-field flex-1 text-left" style={{color:'var(--faint)', borderRadius:999}} onClick={()=>setShowCreatePost(true)}>Share something with the network...</button>
      <button className="w-10 h-10 rounded-full border flex items-center justify-center flex-shrink-0" style={{borderColor:'var(--line)'}} onClick={()=>setShowCreatePost(true)}>
        <i className="fas fa-image" style={{color:'var(--indigo-600)'}}></i>
      </button>
    </div>

    {posts.map(post => (
      <div key={post.id} className="card mb-5">
        <div className="flex items-center gap-3 mb-3">
          <PersonImg src={post.image} fallback={post.fallback} alt={post.name} className="avatar-img" style={{width:44,height:44}} />
          <div>
            <div className="font-semibold text-sm">{post.name}</div>
            <div className="text-xs" style={{color:'var(--muted)'}}>{post.role} · {post.time}</div>
          </div>
        </div>
        <p className="text-sm leading-relaxed" style={{color:'var(--ink-soft)'}}>{post.text}</p>
        {post.photo && <img src={post.photo} alt="" className="mt-3 rounded-xl w-full max-h-80 object-cover" />}
        {post.tag && <div className="mt-3 flex items-center gap-2 text-xs font-semibold px-3 py-2 rounded-lg" style={{background:'var(--green-bg)', color:'var(--green)'}}>
          <i className="fas fa-screwdriver-wrench"></i> {post.tag}
        </div>}
        <div className="flex items-center gap-5 mt-3 pt-3 border-t text-sm" style={{borderColor:'var(--line)', color:'var(--muted)'}}>
          <button className="flex items-center gap-1.5 hover:text-black transition" onClick={()=>likePost(post.id)}>
            <i className={post.liked ? 'fas fa-heart' : 'far fa-heart'} style={post.liked?{color:'var(--red)'}:{}}></i> {post.likes}
          </button>
          <button className="flex items-center gap-1.5 hover:text-black transition" onClick={()=>setOpenComments({...openComments,[post.id]:!openComments[post.id]})}>
            <i className="far fa-comment"></i> {post.comments.length}
          </button>
          <button className="flex items-center gap-1.5 hover:text-black transition"><i className="far fa-share-from-square"></i> {post.shares}</button>
        </div>
        {openComments[post.id] && <div className="mt-3 pt-3 border-t" style={{borderColor:'var(--line)'}}>
          {post.comments.map((c,i)=>(
            <div key={i} className="flex gap-2 text-sm mb-1.5">
              <span className="font-semibold">{c.user}</span>
              <span style={{color:'var(--muted)'}}>{c.text}</span>
            </div>
          ))}
          <div className="flex gap-2 mt-2">
            <input className="input-field text-sm py-1.5" placeholder="Write a comment..." value={commentText[post.id]||''}
              onChange={e=>setCommentText({...commentText,[post.id]:e.target.value})}
              onKeyDown={e=>e.key==='Enter' && handleComment(post.id)} />
            <button className="btn btn-primary btn-sm" onClick={()=>handleComment(post.id)}>Post</button>
          </div>
        </div>}
      </div>
    ))}

    <Modal isOpen={showCreatePost} onClose={()=>setShowCreatePost(false)} title="Create a post">
      <div className="flex items-center gap-3 mb-3">
        <PersonImg src={currentUser.image} fallback={currentUser.fallback} alt={currentUser.name} className="avatar-img" style={{width:40,height:40}} />
        <div><div className="font-semibold text-sm">{currentUser.name}</div><div className="text-xs" style={{color:'var(--muted)'}}>{currentUser.company}</div></div>
      </div>
      <textarea className="input-field" rows="4" placeholder="Share a service, request, or update..." value={draft} onChange={e=>setDraft(e.target.value)} style={{resize:'vertical'}}></textarea>
      <div className="flex justify-end gap-2 mt-4">
        <button className="btn btn-secondary btn-sm" onClick={()=>setShowCreatePost(false)}>Cancel</button>
        <button className="btn btn-primary btn-sm" onClick={()=>{ createPost(draft); setDraft(''); }}>Post</button>
      </div>
    </Modal>
  </div>;
}

  };

  return <div className="flex min-h-screen" style={{background:'var(--bg)'}}>
    <Sidebar active={page} onSelect={(id)=> id==='logout' ? logout() : setPage(id)} />
    <div className="flex-1 p-6 md:p-10 max-w-[1400px] mx-auto w-full">
      <TopBar page={page} setPage={setPage} />
      {render()}
    </div>
    <ToastContainer />
  </div>;
}

function Root() {
  const { page, currentUser } = useApp();
  if (currentUser) return <AppShell />;
  return <div>
    {page === 'landing' ? <LandingPage /> : <LoginPage />}
    <ToastContainer />
  </div>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppProvider><Root /></AppProvider>);
</script>
</body>
</html>
