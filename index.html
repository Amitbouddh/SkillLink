                        <div className="flex items-center gap-2 text-sm"><i className="fas fa-handshake text-[#b26a00]" /><span className="font-medium text-[#1d2228]">माँग / आवश्यकता</span></div>
                    </div>}
                {post.type === 'service' && <div className="mt-3 p-3 bg-[#e1f3e8] rounded-lg border border-[#059669]">
                        <div className="flex items-center gap-2 text-sm"><i className="fas fa-tools text-[#057642]" /><span className="font-medium text-[#1d2228]">सेवा उपलब्ध</span></div>
                    </div>}
                <div className="flex items-center gap-4 mt-3 pt-3 border-t border-[#d1d7df]">
                    <button className="flex items-center gap-1 text-sm text-[#5e6a78] hover:text-[#0a66c2] transition"
                    onClick={() => likePost(post.id)}>
                    <Icon.HeartOutline /> <span>{post.likes}</span>
                </button>
                <button className="flex items-center gap-1 text-sm text-[#5e6a78] hover:text-[#0a66c2] transition"
                onClick={() => setShowComments({ ...showComments, [post.id]: !showComments[post.id] })}>
                <Icon.Comment /> <span>{post.comments.length}</span>
            </button>
            <button className="flex items-center gap-1 text-sm text-[#5e6a78] hover:text-[#0a66c2] transition">
                <Icon.Share /> <span>{post.shares || 0}</span>
            </button>
        </div>
        {showComments[post.id] && <div className="mt-3 pt-3 border-t border-[#d1d7df]">
                {post.comments.map(c => <div key={c.id} className="flex gap-2 mb-2 text-sm">
                        <span className="font-semibold text-[#1d2228]">{c.user}</span>
                        <span className="text-[#5e6a78]">{c.text}</span>
                        <span className="text-xs text-[#8a929f] ml-auto">{c.time}</span>
                    </div>)}
                <div className="flex gap-2 mt-2">
                    <input className="flex-1 input-field text-sm py-1 px-3" placeholder="कमेंट लिखें..."
                    value={commentText[post.id] || ''}
                    onChange={e => setCommentText({ ...commentText, [post.id]: e.target.value })}
                    onKeyDown={e => e.key === 'Enter' && handleComment(post.id)}
                    />
                    <Button size="sm" onClick={() => handleComment(post.id)}>पोस्ट करें</Button>
                </div>
            </div>}
        </Card>
    ))}

    <Modal isOpen={showCreatePost} onClose={() => setShowCreatePost(false)} title="नई पोस्ट">
        <div className="space-y-4">
            <div className="flex items-center gap-3">
                <Avatar src={currentUser?.profileImage} name={currentUser?.name} size={10} />
                <div><div className="font-semibold text-[#1d2228]">{currentUser?.name}</div><div className="text-xs text-[#5e6a78]">{currentUser?.role === 'company' ? 'व्यवसाय' : 'कारीगर'}</div></div>
            </div>
            <textarea className="input-field" rows="4" placeholder="क्या शेयर करना चाहेंगे? (सेवा, माँग, या खोज)"
            value={newPostContent} onChange={e => setNewPostContent(e.target.value)} />
            <div className="flex justify-end gap-2">
                <Button variant="secondary" onClick={() => setShowCreatePost(false)}>रद्द करें</Button>
                <Button onClick={() => createPost(newPostContent)}>पोस्ट करें</Button>
            </div>
        </div>
    </Modal>
</div>;
}

// ─── JOBS ──────────────────────────────────────────────────────────────────────

function JobsPage() {
    const { jobs, applications, applyForJob, currentUser } = useApp();
    const [filter, setFilter] = useState('all');
    const [selectedJob, setSelectedJob] = useState(null);

    const filteredJobs = filter === 'all' ? jobs :
        filter === 'internship' ? jobs.filter(j => j.isInternship) :
        jobs.filter(j => !j.isInternship);

    const hasApplied = (jobId) => applications.some(a => a.jobId === jobId && a.userId === currentUser?.id);

    return <div>
        <h2 className="text-xl font-bold text-[#1d2228] mb-4">अवसर / Jobs</h2>
        <div className="flex gap-2 mb-4 flex-wrap">
            <button className={`tab-btn ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>सभी</button>
            <button className={`tab-btn ${filter === 'full-time' ? 'active' : ''}`} onClick={() => setFilter('full-time')}>Full-time</button>
            <button className={`tab-btn ${filter === 'internship' ? 'active' : ''}`} onClick={() => setFilter('internship')}>इंटर्नशिप</button>
        </div>
        <div className="space-y-4">
            {filteredJobs.map(job => (
                <Card key={job.id} className="hover:border-[#d1d7df]">
                    <div className="flex items-start gap-4">
                        <img src={job.companyLogo} alt={job.companyName} className="w-14 h-14 rounded-full object-cover border-2 border-white shadow-sm" />
                        <div className="flex-1">
                            <div className="flex items-start justify-between flex-wrap gap-2">
                                <div><h3 className="font-semibold text-[#1d2228]">{job.title}</h3><p className="text-sm text-[#5e6a78]">{job.companyName} · {job.location}</p></div>
                                <div className="text-right"><div className="text-sm font-semibold text-[#0a66c2]">{job.stipend}</div><Badge variant={job.isInternship ? 'purple' : 'blue'}>{job.isInternship ? 'इंटर्नशिप' : 'Full-time'}</Badge></div>
                            </div>
                            <p className="text-sm text-[#5e6a78] mt-2 line-clamp-2">{job.description}</p>
                            <div className="flex flex-wrap gap-2 mt-2">{job.skills.slice(0, 3).map(s => <Badge key={s} variant="gray">{s}</Badge>)}</div>
                            <div className="flex items-center gap-4 mt-3 flex-wrap">
                                <span className="text-xs text-[#8a929f]"><i className="far fa-clock mr-1" /> {job.postedDate}</span>
                                {hasApplied(job.id) ? <Badge variant="yellow">आवेदन किया</Badge> :
                                    <Button size="sm" onClick={() => applyForJob(job.id)}>आवेदन करें</Button>}
                                <Button size="sm" variant="ghost" onClick={() => setSelectedJob(job)}>विवरण</Button>
                            </div>
                        </div>
                    </div>
                </Card>
            ))}
        </div>
        <Modal isOpen={!!selectedJob} onClose={() => setSelectedJob(null)} title="नौकरी का विवरण">
            {selectedJob && <div className="space-y-4">
                    <div className="flex items-center gap-4"><img src={selectedJob.companyLogo} alt={selectedJob.companyName} className="w-16 h-16 rounded-full object-cover" /><div><h3 className="font-bold text-[#1d2228]">{selectedJob.title}</h3><p className="text-sm text-[#5e6a78]">{selectedJob.companyName}</p></div></div>
                    <div className="grid grid-cols-2 gap-3 text-sm"><div><span className="text-[#5e6a78]">स्थान</span><br /><span className="font-medium">{selectedJob.location}</span></div><div><span className="text-[#5e6a78]">पारिश्रमिक</span><br /><span className="font-medium">{selectedJob.stipend}</span></div></div>
                    <div><h4 className="font-medium text-[#1d2228]">विवरण</h4><p className="text-sm text-[#5e6a78] mt-1">{selectedJob.description}</p></div>
                    <div><h4 className="font-medium text-[#1d2228]">आवश्यक कौशल</h4><div className="flex flex-wrap gap-2 mt-1">{selectedJob.skills.map(s => <Badge key={s} variant="blue">{s}</Badge>)}</div></div>
                    <div className="flex gap-3">{hasApplied(selectedJob.id) ? <Badge variant="green">आवेदन किया</Badge> : <Button onClick={() => { applyForJob(selectedJob.id);
                                setSelectedJob(null); }}>आवेदन करें</Button>}<Button variant="secondary" onClick={() => setSelectedJob(null)}>बंद करें</Button></div>
                </div>}
            </Modal>
        </div>;
    }

    // ─── APPLICATIONS ───────────────────────────────────────────────────────────

    function ApplicationsPage() {
        const { applications, jobs, currentUser, updateApplicationStatus } = useApp();
        const [filter, setFilter] = useState('all');

        const userApps = applications.filter(a => a.userId === currentUser?.id);
        const filteredApps = filter === 'all' ? userApps : userApps.filter(a => a.status === filter);

        const getJobTitle = (jobId) => jobs.find(j => j.id === jobId)?.title || 'Unknown';

        return <div>
            <h2 className="text-xl font-bold text-[#1d2228] mb-4">मेरे आवेदन</h2>
            <div className="flex gap-2 mb-4 flex-wrap">
                {['all', 'applied', 'shortlisted', 'rejected'].map(t =>
                    <button key={t} className={`tab-btn ${filter === t ? 'active' : ''}`} onClick={() => setFilter(t)}>
                        {t === 'all' ? 'सभी' : t === 'applied' ? 'आवेदित' : t === 'shortlisted' ? 'शॉर्टलिस्ट' : 'अस्वीकृत'}
                    </button>
                )}
            </div>
            {filteredApps.length === 0 ? <div className="text-center py-10 text-[#8a929f]"><i className="fas fa-inbox text-3xl block mb-2" />कोई आवेदन नहीं</div> :
                <div className="space-y-3">
                    {filteredApps.map(app => (
                        <Card key={app.id}>
                            <div className="flex items-center justify-between flex-wrap gap-2">
                                <div><div className="font-semibold text-[#1d2228]">{getJobTitle(app.jobId)}</div><div className="text-xs text-[#8a929f]">आवेदन {app.appliedDate}</div></div>
                                <div className="flex items-center gap-3">
                                    <Badge variant={app.status === 'shortlisted' ? 'green' : app.status === 'rejected' ? 'red' : 'yellow'}>
                                        {app.status === 'shortlisted' ? 'शॉर्टलिस्ट' : app.status === 'rejected' ? 'अस्वीकृत' : 'आवेदित'}
                                    </Badge>
                                    {currentUser?.role === 'company' && app.status === 'applied' && <>
                                            <Button size="sm" onClick={() => updateApplicationStatus(app.id, 'shortlisted')}>शॉर्टलिस्ट करें</Button>
                                            <Button size="sm" variant="secondary" onClick={() => updateApplicationStatus(app.id, 'rejected')}>अस्वीकार करें</Button>
                                        </>}
                                </div>
                            </div>
                        </Card>
                    ))}
                </div>}
            </div>;
        }

        // ─── PROFILE ──────────────────────────────────────────────────────────────

        function ProfilePage() {
            const { currentUser } = useApp();
            if (!currentUser) return <div>Please login</div>;
            const isCompany = currentUser.role === 'company';

            return <div className="max-w-3xl mx-auto">
                <div className="bg-white rounded-xl overflow-hidden shadow-card">
                    <img src={currentUser.coverImage || 'https://picsum.photos/seed/default/800/200'} alt="Cover" className="w-full h-48 object-cover" />
                    <div className="px-6 pb-6 relative">
                        <div className="flex flex-col md:flex-row items-start gap-4 -mt-12">
                            <Avatar src={currentUser.profileImage} name={currentUser.name} size={20} className="border-4 border-white shadow-md" />
                            <div className="flex-1 pt-4 md:pt-0">
                                <h2 className="text-2xl font-bold text-[#1d2228]">{currentUser.name}</h2>
                                <p className="text-sm text-[#5e6a78]">{isCompany ? currentUser.company : currentUser.bio}</p>
                                <div className="flex items-center gap-3 text-sm text-[#5e6a78] mt-1">
                                    <span><i className="fas fa-map-marker-alt mr-1" /> {currentUser.location}</span>
                                    {isCompany && <span><i className="fas fa-users mr-1" /> {currentUser.size}</span>}
                                </div>
                            </div>
                        </div>
                        {!isCompany && <div className="mt-4"><h4 className="font-semibold text-[#1d2228]">कौशल / Skills</h4><div className="flex flex-wrap gap-2 mt-1">{currentUser.skills?.map(s => <Badge key={s} variant="blue">{s}</Badge>)}</div></div>}
                        {!isCompany && currentUser.services && <div className="mt-4"><h4 className="font-semibold text-[#1d2228]">सेवाएँ / Services</h4><div className="flex flex-wrap gap-2 mt-1">{currentUser.services.map(s => <Badge key={s} variant="green">{s}</Badge>)}</div></div>}
                        {isCompany && <div className="mt-4"><h4 className="font-semibold text-[#1d2228]">उत्पाद / Products</h4><div className="flex flex-wrap gap-2 mt-1">{currentUser.products?.map(p => <Badge key={p} variant="purple">{p}</Badge>)}</div></div>}
                        {!isCompany && currentUser.experience?.length > 0 && <div className="mt-4"><h4 className="font-semibold text-[#1d2228]">अनुभव</h4>{currentUser.experience.map((exp, i) => <div key={i} className="text-sm mt-1"><span className="font-medium">{exp.title}</span> at {exp.company} <span className="text-[#5e6a78]">· {exp.from} - {exp.to}</span></div>)}</div>}
                        {isCompany && <div className="mt-4"><h4 className="font-semibold text-[#1d2228]">हमारे बारे में</h4><p className="text-sm text-[#5e6a78] mt-1">{currentUser.about}</p><div className="flex gap-3 mt-2 text-sm"><span><i className="fas fa-globe mr-1" /> {currentUser.website}</span><span><i className="fas fa-industry mr-1" /> {currentUser.industry}</span></div></div>}
                    </div>
                </div>
            </div>;
        }

        // ─── MESSAGES ────────────────────────────────────────────────────────────

        function MessagesPage() {
            const { messages, selectedChat, setSelectedChat, currentUser } = useApp();
            const [newMsg, setNewMsg] = useState('');

            const chatUsers = messages.reduce((acc, m) => {
                const otherId = m.senderId === currentUser?.id ? m.receiverId : m.senderId;
                if (!acc.find(u => u.id === otherId)) {
                    const user = MOCK_USERS.find(u => u.id === otherId);
                    if (user) acc.push({ id: user.id, name: user.name, image: user.profileImage, last: m.text,
                        time: m.time });
                }
                return acc;
            }, []);

            const selectedChatData = messages.filter(m =>
                (m.senderId === currentUser?.id && m.receiverId === selectedChat) ||
                (m.senderId === selectedChat && m.receiverId === currentUser?.id)
            );
            const selectedUser = MOCK_USERS.find(u => u.id === selectedChat);

            const sendMessage = () => {
                if (!newMsg.trim() || !selectedChat) return;
                messages.push({
                    id: Date.now(),
                    senderId: currentUser?.id,
                    senderName: currentUser?.name,
                    senderImage: currentUser?.profileImage,
                    receiverId: selectedChat,
                    text: newMsg,
                    time: 'अभी',
                    read: true,
                });
                setNewMsg('');
            };

            return <div className="flex flex-col md:flex-row gap-4 h-[600px]">
                <div className="w-full md:w-72 bg-white rounded-xl border border-[#d1d7df] overflow-hidden flex flex-col shadow-card">
                    <div className="p-3 border-b border-[#d1d7df]"><div className="relative"><i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-[#8a929f]" /><input className="input-field pl-10" placeholder="संदेश खोजें..." /></div></div>
                    <div className="flex-1 overflow-y-auto">
                        {chatUsers.map(u => <div key={u.id} className={`p-3 border-b border-[#d1d7df] cursor-pointer transition ${selectedChat === u.id ? 'bg-[#e8f0fe]' : 'hover:bg-[#f3f6f9]'}`}
                            onClick={() => setSelectedChat(u.id)}>
                                <div className="flex items-center gap-3"><img src={u.image} alt={u.name} className="w-10 h-10 rounded-full object-cover" /><div className="flex-1 min-w-0"><div className="font-semibold text-[#1d2228]">{u.name}</div><div className="text-sm text-[#5e6a78] truncate">{u.last}</div></div><div className="text-xs text-[#8a929f] flex-shrink-0">{u.time}</div></div>
                            </div>)}
                        {chatUsers.length === 0 && <div className="text-center py-8 text-[#8a929f]"><i className="fas fa-inbox text-3xl block mb-2" />कोई संदेश नहीं</div>}
                    </div>
                </div>
                <div className="flex-1 bg-white rounded-xl border border-[#d1d7df] flex flex-col overflow-hidden shadow-card">
                    {selectedChat && selectedUser ? <>
                            <div className="p-3 border-b border-[#d1d7df] flex items-center gap-3">
                                <img src={selectedUser.profileImage} alt={selectedUser.name} className="w-10 h-10 rounded-full object-cover" />
                                <div><div className="font-semibold text-[#1d2228]">{selectedUser.name}</div><div className="text-xs text-[#057642]"><i className="fas fa-circle text-[10px] mr-1" /> ऑनलाइन</div></div>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                {selectedChatData.map((msg, i) => {
                                    const isSent = msg.senderId === currentUser?.id;
                                    return <div key={i} className={`flex ${isSent ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`msg-bubble ${isSent ? 'sent' : 'received'}`}>
                                            {msg.text}
                                            <div className={`text-xs mt-1 ${isSent ? 'text-[#93b5f8]' : 'text-[#8a929f]'}`}>{msg.time}</div>
                                        </div>
                                    </div>;
                                })}
                            </div>
                            <div className="p-3 border-t border-[#d1d7df] flex items-center gap-2">
                                <input className="flex-1 input-field" placeholder="संदेश लिखें..."
                                value={newMsg} onChange={e => setNewMsg(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && sendMessage()} />
                                <Button size="sm" onClick={sendMessage}><Icon.Send /></Button>
                            </div>
                        </> :
                        <div className="flex-1 flex items-center justify-center text-[#8a929f]">
                            <div className="text-center"><i className="fas fa-comment-dots text-4xl block mb-2" /><p>कोई बातचीत चुनें</p></div>
                        </div>}
                    </div>
                </div>;
            }

            // ─── NOTIFICATIONS ─────────────────────────────────────────────────────

            function NotificationsPage() {
                const { notifications, setNotifications, addToast } = useApp();

                const markAllRead = () => {
                    setNotifications(notifications.map(n => ({ ...n, read: true })));
                    addToast('सभी नोटिफिकेशन पढ़े गए', 'info');
                };

                return <div>
                    <div className="flex items-center justify-between mb-4">
                        <h2 className="text-xl font-bold text-[#1d2228]">सूचनाएँ</h2>
                        <Button size="sm" variant="secondary" onClick={markAllRead}>सभी पढ़ें</Button>
                    </div>
                    <div className="space-y-2">
                        {notifications.map(n => <Card key={n.id} className={`${!n.read ? 'border-l-4 border-l-[#0a66c2]' : ''}`}>
                                <div className="flex items-center gap-3">
                                    <div className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ${!n.read ? 'bg-[#0a66c2]' : 'bg-[#d1d7df]'}`} />
                                    <div className="flex-1"><div className="text-sm text-[#1d2228]">{n.text}</div><div className="text-xs text-[#8a929f]"><i className="far fa-clock mr-1" /> {n.time}</div></div>
                                </div>
                            </Card>)}
                        </div>
                    </div>;
                }

                // ─── APP ────────────────────────────────────────────────────────────────

                function App() {
                    const { currentPage, setCurrentPage, currentUser, logout, addToast } = useApp();

                    if (!currentUser) {
                        return <div>
                            {currentPage === 'landing' ? <LandingPage /> : <LoginPage />}
                            <ToastContainer />
                        </div>;
                    }

                    const sidebarItems = [
                        { id: 'feed', label: 'फीड', icon: Icon.Feed },
                        { id: 'jobs', label: 'अवसर', icon: Icon.Jobs },
                        { id: 'applications', label: 'आवेदन', icon: Icon.Applicants },
                        { id: 'messages', label: 'संदेश', icon: Icon.Messages, badge: '2' },
                        { id: 'notifications', label: 'सूचनाएँ', icon: Icon.Notifications, badge: '3' },
                        { id: 'profile', label: 'प्रोफाइल', icon: Icon.Profile },
                    ];

                    const bottomItems = [
                        { id: 'settings', label: 'सेटिंग्स', icon: Icon.Settings },
                        { id: 'logout', label: 'लॉग आउट', icon: Icon.LogOut },
                    ];

                    const renderContent = () => {
                        switch (currentPage) {
                            case 'feed':
                                return <FeedPage />;
                            case 'jobs':
                                return <JobsPage />;
                            case 'applications':
                                return <ApplicationsPage />;
                            case 'messages':
                                return <MessagesPage />;
                            case 'notifications':
                                return <NotificationsPage />;
                            case 'profile':
                                return <ProfilePage />;
                            default:
                                return <FeedPage />;
                        }
                    };

                    return <div className="flex min-h-screen bg-[#f3f6f9]">
                        <Sidebar items={sidebarItems} active={currentPage} onSelect={(id) => {
                                if (id === 'logout') { logout(); return; }
                                if (id === 'settings') { addToast('सेटिंग्स (डेमो)', 'info'); return; }
                                setCurrentPage(id);
                            }} bottomItems={bottomItems} />
                        <div className="flex-1 overflow-y-auto p-6 md:p-8 max-w-5xl mx-auto">
                            <div className="flex items-center justify-between mb-6">
                                <div>
                                    <h2 className="text-xl font-bold text-[#1d2228]">
                                        {currentPage === 'feed' ? 'होम' :
                                            currentPage === 'jobs' ? 'अवसर' :
                                            currentPage === 'applications' ? 'मेरे आवेदन' :
                                            currentPage === 'messages' ? 'संदेश' :
                                            currentPage === 'notifications' ? 'सूचनाएँ' :
                                            currentPage === 'profile' ? 'प्रोफाइल' : 'SkillLink'}
                                    </h2>
                                    <p className="text-sm text-[#5e6a78]">स्वागत है, {currentUser?.name}</p>
                                </div>
                                <Avatar src={currentUser?.profileImage} name={currentUser?.name} size={9} />
                            </div>
                            {renderContent()}
                        </div>
                        <ToastContainer />
                    </div>;
                }

                // ─── RENDER ────────────────────────────────────────────────────────────

                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(
                    <AppProvider>
                        <App />
                    </AppProvider>
                );
            </script>

        </body>
        </html>
